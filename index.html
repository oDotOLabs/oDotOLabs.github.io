<!doctype html>
<html>
    <head>
        <meta charset="UTF-8" />
        <title>o.O Labs</title>

        <link rel="preconnect" href="https://fonts.googleapis.com" />
        <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
        <link
            href="https://fonts.googleapis.com/css2?family=Noto+Sans:ital,wght@0,100..900;1,100..900&display=swap"
            rel="stylesheet"
        />

        <style>
            /* 移除瀏覽器預設邊距並設定底色 */
            body {
                margin: 0;
                background-color: #faf7ff;
                font-family: "Noto Sans", sans-serif;
                font-optical-sizing: auto;
                font-weight: 400;
                font-style: normal;
                font-variation-settings: "wdth" 100;
            }

            /* 頂欄樣式 */
            .header {
                display: flex;
                justify-content: center;
                align-items: center;
                padding: 20px 0;
            }

            .header img {
                height: 60px;
                width: auto;
            }

            /* 圖片信息流容器 - 垂直排列 */
            .gallery {
                display: flex;
                flex-direction: column;
                width: 100%;
            }

            /* 信息流項目 */
            .gallery-item {
                position: relative;
                width: 100%;
                height: 400px;
                overflow: hidden;
                display: flex;
                justify-content: center;
                align-items: center;
            }

            /* 臨時色塊背景 */
            .gallery-item:nth-child(1) {
                background-color: #e8daff;
            }

            .gallery-item:nth-child(2) {
                background-color: #d4c5f9;
            }

            .gallery-item:nth-child(3) {
                background-color: #c3b1e1;
            }

            /* 連結覆蓋層 */
            .gallery-item a {
                position: absolute;
                width: 100%;
                height: 100%;
                display: flex;
                justify-content: center;
                align-items: center;
                color: #663399;
                font-size: 32px;
                font-weight: 600;
                text-decoration: none;
                transition: background-color 0.3s ease;
            }

            .gallery-item a:hover {
                background-color: rgba(102, 51, 153, 0.1);
            }

            /* 底部欄樣式 */
            .footer {
                padding: 40px 20px;
                text-align: center;
                background-color: #faf7ff;
            }

            .footer-links {
                display: flex;
                justify-content: center;
                align-items: center;
                gap: 30px;
                flex-wrap: wrap;
            }

            .footer-links a {
                color: #8b7ba8;
                font-size: 14px;
                font-weight: 500;
                text-decoration: none;
                transition: color 0.3s ease;
                position: relative;
            }

            .footer-links a:hover {
                color: #663399;
            }

            /* 分隔符 */
            .footer-links .separator {
                color: #d4c5f9;
                user-select: none;
            }

            /* 響應式調整 */
            @media (max-width: 768px) {
                .gallery-item {
                    height: 300px;
                }

                .gallery-item a {
                    font-size: 24px;
                }

                .footer-links {
                    gap: 20px;
                }

                .footer-links a {
                    font-size: 13px;
                }
            }
        </style>
    </head>
    <body>
        <div class="header">
            <img src="./Logo.png" alt="o.O Labs Logo" />
        </div>

        <div class="gallery">
            <div class="gallery-item">
                <a href="https://matrix.to/#/#o.O:matrix.org">Matrix</a>
            </div>
            <div class="gallery-item">
                <a href="https://github.com/oDotOLabs">GitHub</a>
            </div>
            <div class="gallery-item">
                <a href="https://huggingface.co/oDotOLabs">Hugging Face</a>
            </div>
        </div>

        <div class="footer">
            <div class="footer-links">
                <a href="/support">支持</a>
                <span class="separator">·</span>
                <a href="/privacy">隱私政策</a>
            </div>
        </div>
    </body>
</html>
